name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --build-name=${{ github.ref_name }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/timehop-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timehop-apk
          path: build/app/outputs/flutter-apk/timehop-${{ github.ref_name }}.apk

  build-android-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build AAB (release)
        run: flutter build appbundle --release --build-name=${{ github.ref_name }} --build-number=${{ github.run_number }}

      - name: Rename AAB
        run: mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/timehop-${{ github.ref_name }}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: timehop-aab
          path: build/app/outputs/bundle/release/timehop-${{ github.ref_name }}.aab

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-android-aab]
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: timehop-apk
          path: artifacts/

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: timehop-aab
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Timehop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/timehop-${{ github.ref_name }}.apk
            artifacts/timehop-${{ github.ref_name }}.aab
          generate_release_notes: true
